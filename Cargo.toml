[package]
name = "drzreplay"
version = "2.0.0"
edition = "2021"
description = "Instant replay for Linux (X11 and Wayland)"
license = "MIT"
publish = false

[[bin]]
name = "drzreplay"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
x11rb = { version = "0.13", features = ["xinput", "randr", "render"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_12"], optional = true }
libadwaita = { version = "0.7", features = ["v1_5"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
