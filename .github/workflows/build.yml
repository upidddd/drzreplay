name: Build

# every push: build, test and keep the .deb as an artifact
# a v* tag: the same, then publish a GitHub release
# Built on Ubuntu 24.04 so the program runs on Ubuntu 24.04+, Debian 13+ and what is based on them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev ffmpeg

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Smoke test
        run: |
          ./target/release/drzreplay --version
          ./target/release/drzreplay --help

      - name: Package
        run: |
          packaging/build-deb.sh
          cp dist/drzreplay_*_amd64.deb dist/drzreplay_all.deb       # stable name for releases/latest/download
          sed "s|@REPO@|${{ github.repository }}|g" packaging/install.sh > dist/install.sh
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: drzreplay-deb
          path: dist/
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/drzreplay_*_amd64.deb dist/drzreplay_all.deb dist/install.sh \
            --title "DrzReplay ${GITHUB_REF_NAME#v}" --notes "DrzReplay ${GITHUB_REF_NAME#v}"
